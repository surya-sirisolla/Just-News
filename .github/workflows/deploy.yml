name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # lets GitHub prove its identity to AWS (OIDC); no AWS keys stored here

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get install -yq libmagic1 fonts-dejavu-core
      - run: pip install -r requirements.txt
      - run: python -m unittest discover tests
        env:
          JUSTNEWS_LOG_LEVEL: CRITICAL

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    concurrency: production
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through AWS Systems Manager
        run: |
          id=$(aws ssm send-command \
                 --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
                 --document-name AWS-RunShellScript \
                 --comment "deploy ${GITHUB_SHA::7}" \
                 --parameters 'commands=["/opt/justnews/deploy/deploy.sh"]' \
                 --query Command.CommandId --output text)
          for i in $(seq 1 60); do
            status=$(aws ssm get-command-invocation --command-id "$id" \
                       --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          test "$status" = Success
